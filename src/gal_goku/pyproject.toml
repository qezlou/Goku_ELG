[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gal_goku"
version = "0.0.0"
description = "Galaxy Emulator based on Goku suite"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Mahdi Qezlou", email = "mahdi.qezlou@email.ucr.edu"},
    {name = "Yanhui Yang"},
    {name = "Simeon Bird"},
]
maintainers = [
    {name = "Mahdi Qezlou", email = "mahdi.qezlou@email.ucr.edu"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["cosmology", "galaxy", "emulator", "halo mass function", "machine learning", "gaussian processes"]

# Core dependencies with GPU-enabled TensorFlow by default
dependencies = [
    "scipy",
    "scikit-learn",
    "matplotlib",
    "h5py",
    "mcfit",
    "cython",
    "gpflow>=2.6.0",
    "tensorflow[and-cuda]~=2.19.0",
    "tensorflow-probability~=0.25.0",
    "colossus",
    "camb",
    "configobj",
    "mfgpflow @ git+https://github.com/qezlou/multi_fidelity_gpflow.git@learnable-heteroscedasticity",
]

[project.optional-dependencies]
# CPU-only installation for systems without GPU
cpu = [
    "tensorflow-cpu~=2.19.0",
]

# Full GPU support with additional monitoring tools
gpu = [
    "tensorflow[and-cuda]~=2.19.0",
    "nvidia-ml-py3",  # For GPU monitoring
]

# Development dependencies
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black>=22.0",
    "flake8",
    "mypy",
    "pre-commit",
    "jupyter",
    "ipykernel",
]

# HPC/Cluster optional dependencies (may have compiler issues)
cluster = [
    "classylss @ git+https://github.com/sbird/classylss.git",
]

# Documentation dependencies
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

# All development tools
all = [
    "gal_goku[gpu,dev,docs,cluster]"
]

[project.urls]
Homepage = "https://github.com/qezlou/private-HETDEX-cosmo"
Documentation = "https://github.com/qezlou/private-HETDEX-cosmo"
Repository = "https://github.com/qezlou/private-HETDEX-cosmo"
"Bug Tracker" = "https://github.com/qezlou/private-HETDEX-cosmo/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-dir]
"" = "."

# Black code formatting
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
    "src",
]
python_files = [
    "test_*.py",
    "*_test.py",
]

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Coverage.py configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]